<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Daily Report</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f2f4f7;
      padding: 20px;
      color: #111;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }

    .header {
      background: #111;
      color: white;
      padding: 40px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header p {
      color: #bbb;
      font-size: 18px;
    }

    .section {
      padding: 30px;
      border-top: 1px solid #e5e7eb;
    }

    .section-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .crew-card {
      border: 1px solid #d1d5db;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .crew-card h3 {
      font-size: 20px;
    }

    .crew-card input {
      width: 90px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .total-workers {
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
    }

    button {
      border: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .primary {
      background: #111;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .green {
      background: #059669;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .photo-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .saved-report {
      border: 1px solid #d1d5db;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .badge {
      background: #e5e7eb;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 32px;
      }

      .section {
        padding: 20px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Construction Daily Report</h1>
    <p>Professional mobile-first jobsite reporting</p>
  </div>

  <div class="section">
    <div class="section-title">Project Information</div>

    <div class="grid">
      <div class="field">
        <label>Project Name</label>
        <input type="text" id="projectName" placeholder="Nashville Medical Tower" />
      </div>

      <div class="field">
        <label>Superintendent</label>
        <input type="text" id="superintendent" placeholder="Jonathan Day" />
      </div>

      <div class="field">
        <label>Date</label>
        <input type="date" id="date" />
      </div>

      <div class="field">
        <label>Weather</label>
        <input type="text" id="weather" value="Sunny - 72°F" />
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Crew Tracking</div>

    <div class="total-workers">
      Total Workers: <span id="totalWorkers">0</span>
    </div>

    <div class="grid">

      <div class="crew-card">
        <h3>Concrete</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Electrical</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Plumbing</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>HVAC</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Framers</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Drywall</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Roofers</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Trim/Paint</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

      <div class="crew-card">
        <h3>Day Labor</h3>
        <input type="number" min="0" class="worker-input" placeholder="0" />
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title">Daily Notes</div>

    <div class="buttons" style="margin-bottom:20px;">
      <button class="primary" onclick="startVoiceInput('notes')">
        🎤 Voice to Text
      </button>
    </div>

    <div class="field">
      <textarea id="notes" placeholder="Describe completed work, inspections, deliveries, incidents, etc..."></textarea>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Delays / Issues</div>

    <div class="buttons" style="margin-bottom:20px;">
      <button class="primary" onclick="startVoiceInput('delays')">
        🎤 Voice to Text
      </button>
    </div>

    <div class="field">
      <textarea id="delays" placeholder="Weather delays, missing materials, coordination conflicts, equipment failures..."></textarea>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Progress Photos</div>

    <input type="file" id="photoUpload" accept="image/*" multiple />

    <div class="photo-grid" id="photoGrid"></div>
  </div>

  <div class="section">
    <div class="buttons">
      <button class="green" onclick="saveReport()">Save Report</button>
      <button class="primary" onclick="newReport()">New Report</button>
      <button class="blue" onclick="exportReport()">Export PDF</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Saved Reports</div>
    <div id="savedReports"></div>
  </div>

</div>

<script>

function getLocalDate() {
  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

document.getElementById('date').value = getLocalDate();

const workerInputs = document.querySelectorAll('.worker-input');
const totalWorkers = document.getElementById('totalWorkers');
const photoGrid = document.getElementById('photoGrid');
const savedReports = document.getElementById('savedReports');

let photos = [];
let reports = [];
let currentReportId = null;

function updateTotalWorkers() {

  let total = 0;

  workerInputs.forEach(input => {
    total += Number(input.value || 0);
  });

  totalWorkers.textContent = total;
}

workerInputs.forEach(input => {
  input.addEventListener('input', updateTotalWorkers);
});

updateTotalWorkers();

document.getElementById('photoUpload').addEventListener('change', function(event) {

  const files = Array.from(event.target.files);

  files.forEach(file => {

    const reader = new FileReader();

    reader.onload = function(e) {

      photos.push(e.target.result);

      const img = document.createElement('img');
      img.src = e.target.result;

      photoGrid.appendChild(img);
    };

    reader.readAsDataURL(file);

  });

});

function startVoiceInput(targetId = 'notes') {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert('Voice recognition is not supported on this device.');
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = 'en-US';
  recognition.start();

  recognition.onresult = function(event) {

    const transcript = event.results[0][0].transcript;

    const targetField = document.getElementById(targetId);

    targetField.value += ' ' + transcript;
  };
}

function collectReportData() {

  return {

    id: currentReportId || Date.now(),

    projectName: document.getElementById('projectName').value,

    superintendent: document.getElementById('superintendent').value,

    date: document.getElementById('date').value,

    weather: document.getElementById('weather').value,

    notes: document.getElementById('notes').value,

    delays: document.getElementById('delays').value,

    manpower: {
      concrete: workerInputs[0].value,
      electrical: workerInputs[1].value,
      plumbing: workerInputs[2].value,
      hvac: workerInputs[3].value,
      framers: workerInputs[4].value,
      drywall: workerInputs[5].value,
      roofers: workerInputs[6].value,
      trimPaint: workerInputs[7].value,
      dayLabor: workerInputs[8].value,
    },

    totalWorkers: totalWorkers.textContent,

    photos: photos
  };
}

function saveReport() {

  const report = collectReportData();

  const existingIndex = reports.findIndex(r => r.id === report.id);

  if (existingIndex !== -1) {
    reports[existingIndex] = report;
  } else {
    reports.push(report);
  }

  localStorage.setItem(
    'dailyReports',
    JSON.stringify(reports)
  );

  renderSavedReports();

  alert('Daily report saved successfully.');
}

function renderSavedReports() {

  savedReports.innerHTML = '';

  reports
    .slice()
    .reverse()
    .forEach(report => {

      const div = document.createElement('div');

      div.className = 'saved-report';

      div.innerHTML = `

        <div>
          <div style="font-weight:bold;font-size:18px;">
            ${report.projectName || 'Untitled Project'}
          </div>

          <div style="color:#666;margin-top:4px;">
            ${report.date}
          </div>
        </div>

        <div style="display:flex;gap:12px;align-items:center;">

          <div class="badge">
            ${report.totalWorkers} Workers
          </div>

          <button class="primary"
            onclick="loadReport(${report.id})">
            Open
          </button>

          <button class="danger"
            onclick="deleteReport(${report.id})">
            Delete
          </button>

        </div>
      `;

      savedReports.appendChild(div);

    });
}

function loadReport(reportId) {

  const report = reports.find(r => r.id === reportId);

  if (!report) return;

  currentReportId = report.id;

  document.getElementById('projectName').value =
    report.projectName || '';

  document.getElementById('superintendent').value =
    report.superintendent || '';

  document.getElementById('date').value =
    report.date || '';

  document.getElementById('weather').value =
    report.weather || '';

  document.getElementById('notes').value =
    report.notes || '';

  document.getElementById('delays').value =
    report.delays || '';

  workerInputs[0].value = report.manpower.concrete || 0;
  workerInputs[1].value = report.manpower.electrical || 0;
  workerInputs[2].value = report.manpower.plumbing || 0;
  workerInputs[3].value = report.manpower.hvac || 0;
  workerInputs[4].value = report.manpower.framers || 0;
  workerInputs[5].value = report.manpower.drywall || 0;
  workerInputs[6].value = report.manpower.roofers || 0;
  workerInputs[7].value = report.manpower.trimPaint || 0;
  workerInputs[8].value = report.manpower.dayLabor || 0;

  updateTotalWorkers();

  photos = report.photos || [];

  photoGrid.innerHTML = '';

  photos.forEach(photo => {

    const img = document.createElement('img');

    img.src = photo;

    photoGrid.appendChild(img);

  });

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

function deleteReport(reportId) {

  const confirmed = confirm(
    'Delete this saved report?'
  );

  if (!confirmed) return;

  reports = reports.filter(r => r.id !== reportId);

  localStorage.setItem(
    'dailyReports',
    JSON.stringify(reports)
  );

  renderSavedReports();
}

function newReport() {

  currentReportId = null;

  document.getElementById('projectName').value = '';
  document.getElementById('superintendent').value = '';

  // Reset date to today's LOCAL date
  document.getElementById('date').value = getLocalDate();

  // Restore default weather
  document.getElementById('weather').value = 'Sunny - 72°F';

  document.getElementById('notes').value = '';
  document.getElementById('delays').value = '';

  // Clear crew inputs so placeholders show again
  workerInputs.forEach(input => {
    input.value = '';
  });

  photos = [];

  photoGrid.innerHTML = '';

  updateTotalWorkers();

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

function exportReport() {

  const report = collectReportData();

  const newWindow = window.open('', '_blank');

  const photoHtml = report.photos
    .map(photo =>
      `<img src="${photo}"
        style="width:240px;border-radius:14px;margin:10px;" />`
    )
    .join('');

  newWindow.document.write(`

    <html>

    <head>
      <title>Construction Daily Report</title>
    </head>

    <body style="font-family:Arial;padding:40px;color:#111;">

      <h1 style="font-size:42px;">
        Construction Daily Report
      </h1>

      <hr style="margin:30px 0;" />

      <h2>Project Information</h2>

      <p><strong>Project:</strong> ${report.projectName}</p>
      <p><strong>Superintendent:</strong> ${report.superintendent}</p>
      <p><strong>Date:</strong> ${report.date}</p>
      <p><strong>Weather:</strong> ${report.weather}</p>

      <hr style="margin:30px 0;" />

      <h2>Crew Tracking</h2>

      <table style="border-collapse:collapse;width:100%;margin-top:20px;">

        <tr>
          <th style="border:1px solid #ccc;padding:12px;text-align:left;">
            Trade
          </th>

          <th style="border:1px solid #ccc;padding:12px;text-align:left;">
            Workers
          </th>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Concrete</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.concrete}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Electrical</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.electrical}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Plumbing</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.plumbing}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">HVAC</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.hvac}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Framers</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.framers}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Drywall</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.drywall}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Roofers</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.roofers}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Trim/Paint</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.trimPaint}
          </td>
        </tr>

        <tr>
          <td style="border:1px solid #ccc;padding:12px;">Day Labor</td>
          <td style="border:1px solid #ccc;padding:12px;">
            ${report.manpower.dayLabor}
          </td>
        </tr>

      </table>

      <hr style="margin:30px 0;" />

      <h2>Daily Notes</h2>

      <p style="line-height:1.7;">
        ${report.notes}
      </p>

      <hr style="margin:30px 0;" />

      <h2>Delays / Issues</h2>

      <p style="line-height:1.7;">
        ${report.delays}
      </p>

      <hr style="margin:30px 0;" />

      <h2>Progress Photos</h2>

      <div>${photoHtml}</div>

    </body>

    </html>

  `);

  newWindow.document.close();

  newWindow.print();
}

function loadSavedReports() {

  const stored = localStorage.getItem('dailyReports');

  if (stored) {

    reports = JSON.parse(stored);

    reports.forEach(report => {

      if (!report.id) {
        report.id = Date.now() + Math.random();
      }

    });

    renderSavedReports();
  }
}

loadSavedReports();

</script>

</body>
</html>
