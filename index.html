<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Daily Report</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f2f4f7;
      padding: 20px;
      color: #111;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }

    .header {
      background: #111;
      color: white;
      padding: 40px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header p {
      color: #bbb;
      font-size: 18px;
    }

    .section {
      padding: 30px;
      border-top: 1px solid #e5e7eb;
    }

    .section-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .crew-card {
      border: 1px solid #d1d5db;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .crew-card h3 {
      font-size: 20px;
    }

    .crew-card input {
      width: 90px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .total-workers {
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
    }

    button {
      border: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .primary {
      background: #111;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .green {
      background: #059669;
      color: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .photo-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .saved-report {
      border: 1px solid #d1d5db;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .badge {
      background: #e5e7eb;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 32px;
      }

      .section {
        padding: 20px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Construction Daily Report</h1>
      <p>Professional mobile-first jobsite reporting</p>
    </div>

    <div class="section">
      <div class="section-title">Project Information</div>

      <div class="grid">
        <div class="field">
          <label>Project Name</label>
          <input type="text" id="projectName" placeholder="Nashville Medical Tower" />
        </div>

        <div class="field">
          <label>Superintendent</label>
          <input type="text" id="superintendent" placeholder="Jonathan Day" />
        </div>

        <div class="field">
          <label>Date</label>
          <input type="date" id="date" />
        </div>

        <div class="field">
          <label>Weather</label>
          <input type="text" id="weather" value="Sunny - 72°F" />
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Crew Tracking</div>

      <div class="total-workers">
        Total Workers: <span id="totalWorkers">0</span>
      </div>

      <div class="grid">
        <div class="crew-card">
          <h3>Concrete</h3>
          <input type="number" min="0" class="worker-input" value="0" />
        </div>

        <div class="crew-card">
          <h3>Electrical</h3>
          <input type="number" min="0" class="worker-input" value="0" />
        </div>

        <div class="crew-card">
          <h3>Plumbing</h3>
          <input type="number" min="0" class="worker-input" value="0" />
        </div>

        <div class="crew-card">
          <h3>HVAC</h3>
          <input type="number" min="0" class="worker-input" value="0" />
        </div>
        
         <div class="crew-card">
          <h3>Day Laborer</h3>
          <input type="number" min="0" class="worker-input" value="0" />
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Daily Notes</div>

      <div class="buttons" style="margin-bottom:20px;">
        <button class="primary" onclick="startVoiceInput()">🎤 Voice to Text</button>
      </div>

      <div class="field">
        <textarea id="notes" placeholder="Describe completed work, inspections, deliveries, incidents, etc..."></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Delays / Issues</div>

      <div class="field">
        <textarea id="delays" placeholder="Weather delays, missing materials, coordination conflicts, equipment failures..."></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Progress Photos</div>

      <input type="file" id="photoUpload" accept="image/*" multiple />

      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <div class="section">
      <div class="buttons">
        <button class="green" onclick="saveReport()">Save Report</button>
        <button class="blue" onclick="exportReport()">Export PDF</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Saved Reports</div>
      <div id="savedReports"></div>
    </div>

  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();

    const workerInputs = document.querySelectorAll('.worker-input');
    const totalWorkers = document.getElementById('totalWorkers');
    const photoGrid = document.getElementById('photoGrid');
    const savedReports = document.getElementById('savedReports');

    let photos = [];
    let reports = [];

    function updateTotalWorkers() {
      let total = 0;

      workerInputs.forEach(input => {
        total += Number(input.value || 0);
      });

      totalWorkers.textContent = total;
    }

    workerInputs.forEach(input => {
      input.addEventListener('input', updateTotalWorkers);
    });

    updateTotalWorkers();

    document.getElementById('photoUpload').addEventListener('change', function(event) {
      const files = Array.from(event.target.files);

      files.forEach(file => {
        const reader = new FileReader();

        reader.onload = function(e) {
          photos.push(e.target.result);

          const img = document.createElement('img');
          img.src = e.target.result;
          photoGrid.appendChild(img);
        };

        reader.readAsDataURL(file);
      });
    });

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert('Voice recognition is not supported on this device.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const notes = document.getElementById('notes');
        notes.value += ' ' + transcript;
      };
    }

    function collectReportData() {
      return {
        projectName: document.getElementById('projectName').value,
        superintendent: document.getElementById('superintendent').value,
        date: document.getElementById('date').value,
        weather: document.getElementById('weather').value,
        notes: document.getElementById('notes').value,
        delays: document.getElementById('delays').value,
        manpower: {
          concrete: workerInputs[0].value,
          electrical: workerInputs[1].value,
          plumbing: workerInputs[2].value,
          hvac: workerInputs[3].value,
        },
        totalWorkers: totalWorkers.textContent,
        photos: photos
      };
    }

    function saveReport() {
      const report = collectReportData();
      reports.push(report);

      renderSavedReports();

      localStorage.setItem('dailyReports', JSON.stringify(reports));

      alert('Daily report saved successfully.');
    }

    function renderSavedReports() {
      savedReports.innerHTML = '';

      reports.forEach(report => {
        const div = document.createElement('div');
        div.className = 'saved-report';

        div.innerHTML = `
          <div>
            <div style="font-weight:bold;font-size:18px;">${report.projectName || 'Untitled Project'}</div>
            <div style="color:#666;margin-top:4px;">${report.date}</div>
          </div>

          <div class="badge">
            ${report.totalWorkers} Workers
          </div>
        `;

        savedReports.appendChild(div);
      });
    }

    function exportReport() {
      const report = collectReportData();

      const newWindow = window.open('', '_blank');

      const photoHtml = report.photos
        .map(photo => `<img src="${photo}" style="width:240px;border-radius:14px;margin:10px;" />`)
        .join('');

      newWindow.document.write(`
        <html>
        <head>
          <title>Construction Daily Report</title>
        </head>

        <body style="font-family:Arial;padding:40px;color:#111;">
          <h1 style="font-size:42px;">Construction Daily Report</h1>

          <hr style="margin:30px 0;" />

          <h2>Project Information</h2>
          <p><strong>Project:</strong> ${report.projectName}</p>
          <p><strong>Superintendent:</strong> ${report.superintendent}</p>
          <p><strong>Date:</strong> ${report.date}</p>
          <p><strong>Weather:</strong> ${report.weather}</p>

          <hr style="margin:30px 0;" />

          <h2>Crew Tracking</h2>
          <table style="border-collapse:collapse;width:100%;margin-top:20px;">
            <tr>
              <th style="border:1px solid #ccc;padding:12px;text-align:left;">Trade</th>
              <th style="border:1px solid #ccc;padding:12px;text-align:left;">Workers</th>
            </tr>
            <tr>
              <td style="border:1px solid #ccc;padding:12px;">Concrete</td>
              <td style="border:1px solid #ccc;padding:12px;">${report.manpower.concrete}</td>
            </tr>
            <tr>
              <td style="border:1px solid #ccc;padding:12px;">Electrical</td>
              <td style="border:1px solid #ccc;padding:12px;">${report.manpower.electrical}</td>
            </tr>
            <tr>
              <td style="border:1px solid #ccc;padding:12px;">Plumbing</td>
              <td style="border:1px solid #ccc;padding:12px;">${report.manpower.plumbing}</td>
            </tr>
            <tr>
              <td style="border:1px solid #ccc;padding:12px;">HVAC</td>
              <td style="border:1px solid #ccc;padding:12px;">${report.manpower.hvac}</td>
            </tr>
          </table>

          <hr style="margin:30px 0;" />

          <h2>Daily Notes</h2>
          <p style="line-height:1.7;">${report.notes}</p>

          <hr style="margin:30px 0;" />

          <h2>Delays / Issues</h2>
          <p style="line-height:1.7;">${report.delays}</p>

          <hr style="margin:30px 0;" />

          <h2>Progress Photos</h2>
          <div>${photoHtml}</div>
        </body>
        </html>
      `);

      newWindow.document.close();
      newWindow.print();
    }

    function loadSavedReports() {
      const stored = localStorage.getItem('dailyReports');

      if (stored) {
        reports = JSON.parse(stored);
        renderSavedReports();
      }
    }

    loadSavedReports();
  </script>

</body>
</html>
